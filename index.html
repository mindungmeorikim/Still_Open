<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>오늘도 정상영업</title>
  <link rel="stylesheet" href="./style.css" />
  <link rel="stylesheet" href="./mobile_ui.css" />
</head>
<body>
  <div id="game-root">
    <header id="top-ui" aria-label="게임 상태 HUD">
      <section id="day-card" aria-label="현재 영업일">
        <span class="day-card-icon" aria-hidden="true">📅</span>
        <div>
          <p id="day-info">Day 1</p>
          <span id="time-info">08:30 ☀️</span>
        </div>
        <strong id="phase-chip">영업 준비</strong>
      </section>

      <div id="status-panel" aria-label="현재 자원">
        <p id="money-info">₩0</p>
        <p id="diamond-info">다이아 0</p>
        <p id="satisfaction-info">만족도 100</p>
        <p id="mental-info">멘탈 100</p>
        <p id="stock-info">재고 0/40</p>
      </div>

      <nav id="top-icon-menu" aria-label="상단 빠른 메뉴">
        <button class="hud-icon-button" type="button" aria-label="업적" disabled>🏆</button>
        <button class="hud-icon-button" type="button" aria-label="우편함" disabled>✉️</button>
        <button class="hud-icon-button" type="button" aria-label="설정" disabled>⚙️</button>
      </nav>
    </header>

    <main id="game-screen">
      <section id="store-area">
        <div class="store-zone" id="entrance-zone" aria-label="입구" title="입구"></div>
        <div class="store-zone" id="shelf-zone" aria-label="진열대"></div>
        <div class="store-zone" id="counter-zone" aria-label="계산대" title="계산대"></div>
        <div class="store-zone" id="player-zone">플레이어</div>
      </section>

      <section id="message-panel">
        <p id="system-message">게임 준비 중입니다.</p>
      </section>
    </main>

    <footer id="bottom-ui" aria-label="하단 행동 메뉴">
      <div id="action-dock">
        <button id="end-day-button" class="dock-button" type="button">정산</button>
        <button id="start-day-button" class="dock-button" type="button">발주</button>
        <button id="upgrade-shortcut-button" class="dock-button" type="button" disabled>업그레이드</button>
        <button id="shop-shortcut-button" class="dock-button" type="button" disabled>상점</button>
      </div>
      <button id="open-store-button" class="primary-start-button" type="button">영업 시작</button>
    </footer>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
